<!DOCTYPE html>
<!--
  Página de RETORNO Buxxep ← AZUL (dominio del comercio).

  En producción AZUL exige que ApprovedUrl / DeclinedUrl / CancelUrl estén en el
  dominio registrado del comercio (buxxep.com), no en supabase.co. Esta página
  vive en buxxep.com, recibe el retorno del navegador y lo REENVÍA a la Edge
  Function, que hace la verificación de firma y actualiza el pedido.

  AZUL manda a esta URL con nuestros params (s=estado, t=txId, g=firma) MÁS los
  suyos (OrderNumber, AuthHash, IsoCode, ...). Aquí se reconstruye la URL de la
  función y se redirige preservando TODOS los parámetros de AZUL.

  Subir a: https://buxxep.com/azul-return.html
  (debe coincidir con el secreto AZUL_RETURN_PAGE_URL del Edge Function).
-->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Procesando tu pago…</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; background: #050508; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid #1f2937; border-top-color: #00b4d8;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { max-width: 320px; text-align: center; line-height: 1.5; color: #f87171; padding: 0 20px; }
  </style>
  <!-- Sin JS no hay reenvío: se oculta el spinner y se muestra el aviso de abajo. -->
  <noscript>
    <style>#spinner, #msg { display: none; }</style>
  </noscript>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <p id="msg">Confirmando tu pago…</p>

  <noscript>
    <p class="err">
      No pudimos confirmar tu pago automáticamente.
      Revisa el estado en la sección "Mis pedidos" de la app.
    </p>
  </noscript>

  <script>
    (function () {
      // URL base de la Edge Function que procesa el resultado (pública, sin auth).
      var FN = 'https://bctxoyuiwdnkwpseihij.supabase.co/functions/v1/azul-payment';

      function fail(reason) {
        if (reason) console.error('[azul-return]', reason);
        document.getElementById('spinner').style.display = 'none';
        var m = document.getElementById('msg');
        m.className = 'err';
        m.textContent = 'No se pudo confirmar el pago. Revisa tus pedidos o inténtalo de nuevo.';
      }

      try {
        var params = new URLSearchParams(window.location.search);
        var s = params.get('s'); // approved | declined | cancel
        var t = params.get('t'); // txId
        var g = params.get('g'); // firma interna

        if (!s || !t || !g) { fail('faltan s/t/g'); return; }
        if (['approved', 'declined', 'cancel'].indexOf(s) === -1) { fail('estado inválido: ' + s); return; }

        // Se reenvían TODOS los parámetros (incluidos los de AZUL) a la función,
        // que lee por nombre los que necesita (OrderNumber, AuthHash, IsoCode…).
        var dest = FN + '/result/' + encodeURIComponent(s) + '/' +
                   encodeURIComponent(t) + '/' + encodeURIComponent(g) +
                   '?' + params.toString();

        window.location.replace(dest);
      } catch (e) {
        fail(e && e.message);
      }
    })();
  </script>

</body>
</html>
