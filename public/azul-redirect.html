<!DOCTYPE html>
<!--
  Página puente Buxxep → Página de Pago AZUL.

  La app (iOS/Android) abre esta URL en el navegador externo con los campos
  firmados en el fragmento (#). Esta página los lee y hace el POST a AZUL.

  Es necesaria porque AZUL sólo acepta POST (por GET el OrderNumber llega vacío)
  y abrir el navegador desde la app es un GET. El AuthHash ya viene calculado por
  el backend; el AuthKey nunca pasa por aquí.

  Subir a: https://www.buxxep.com/azul-redirect.html
  (o cambiar EXPO_PUBLIC_AZUL_REDIRECT_URL en el .env de la app).
-->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Redirigiendo a AZUL…</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; background: #050508; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid #1f2937; border-top-color: #00b4d8;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { max-width: 320px; text-align: center; line-height: 1.5; color: #f87171; padding: 0 20px; }
    button {
      padding: 14px 28px; font-size: 16px; font-weight: 700; color: #000;
      background: #00b4d8; border: 0; border-radius: 12px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <p id="msg">Conectando con la página de pago segura de AZUL…</p>

  <script>
    (function () {
      var msg = document.getElementById('msg');

      // Mensaje ÚNICO para el usuario final: no le sirve el motivo técnico, sólo
      // saber que algo falló y qué hacer. El detalle real va a la consola.
      function fail(reason) {
        if (reason) console.error('[azul-redirect]', reason);
        document.getElementById('spinner').style.display = 'none';
        msg.className = 'err';
        msg.textContent = 'Ocurrió un problema al abrir el pago. Vuelve a la app e inténtalo de nuevo.';
      }

      // Los campos llegan en el fragmento (#), no en el querystring: así no viajan
      // a los logs de este servidor. Formato: #<JSON url-encoded>.
      var raw = window.location.hash ? window.location.hash.slice(1) : '';
      if (!raw) { fail('hash vacío'); return; }

      var data;
      try {
        data = JSON.parse(decodeURIComponent(raw));
      } catch (e) {
        fail('JSON inválido: ' + e.message);
        return;
      }

      if (!data || !data.action || !data.fields) {
        fail('faltan action/fields');
        return;
      }

      // El destino del POST SÓLO puede ser AZUL. Sin esto, un enlace manipulado
      // (#...action:"sitio-malo"...) haría que esta página envíe el formulario a
      // donde diga el atacante. Se exige https y un dominio azul.com.do.
      function isAzul(url) {
        try {
          var u = new URL(url);
          return u.protocol === 'https:' &&
                 (u.hostname === 'azul.com.do' || u.hostname.endsWith('.azul.com.do'));
        } catch (e) { return false; }
      }
      if (!isAzul(data.action)) {
        fail('destino no permitido: ' + data.action);
        return;
      }
      if (data.alternate && !isAzul(data.alternate)) {
        data.alternate = null; // ignora un alterno manipulado, no abortes
      }

      var form = document.createElement('form');
      form.method = 'POST';
      form.action = data.action;

      Object.keys(data.fields).forEach(function (name) {
        var input = document.createElement('input');
        input.type  = 'hidden';
        input.name  = name;
        input.value = data.fields[name];
        form.appendChild(input);
      });

      document.body.appendChild(form);

      // Contingencia: si el site principal de AZUL no responde en 8s, se ofrece
      // reintentar por el site alterno.
      var submitted = false;
      function submitTo(action) {
        if (submitted) return;
        submitted = true;
        form.action = action;
        form.submit();
      }

      if (data.alternate && data.alternate !== data.action) {
        setTimeout(function () {
          if (document.visibilityState === 'visible' && !document.hidden) {
            submitted = false;
            submitTo(data.alternate);
          }
        }, 8000);
      }

      submitTo(data.action);
    })();
  </script>

  <noscript>
    <p class="err">Ocurrió un problema al abrir el pago. Vuelve a la app e inténtalo de nuevo.</p>
  </noscript>
</body>
</html>
